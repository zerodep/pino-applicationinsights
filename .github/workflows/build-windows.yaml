name: Build (Windows)

on:
  pull_request:
  push:
    branches:
      - default

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm i --loglevel=error
      - run: npm run build
      - run: npx mocha
